<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUNE — Celestial Fragrances</title>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    @font-face {
      font-family: "Helvetica Regular";
      src: url("https://db.onlinewebfonts.com/t/a64ff11d2c24584c767f6257e880dc65.woff2") format("woff2"),
           url("https://db.onlinewebfonts.com/t/a64ff11d2c24584c767f6257e880dc65.woff") format("woff"),
           url("https://db.onlinewebfonts.com/t/a64ff11d2c24584c767f6257e880dc65.ttf") format("truetype");
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; }
    html { scroll-behavior: auto; }
    body {
      font-family: "Helvetica Regular", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #000;
    }

    /* ── Liquid Glass ── */
    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%,
        rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0)    40%,
        rgba(255,255,255,0)    60%,
        rgba(255,255,255,0.15) 80%,
        rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* ── Background video ── */
    .bg-video-el {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: max(100vw, 177.78vh);
      height: max(56.25vw, 100vh);
      object-fit: cover;
    }
    @media (max-width: 768px) {
      .bg-video-el {
        width: max(100vw, 140vh);
        height: max(71vw, 100vh);
      }
    }

    /* ── Scroll indicator ── */
    @keyframes chevronDrift {
      0%, 100% { transform: translateY(0);   opacity: 0.7; }
      50%       { transform: translateY(7px); opacity: 1;   }
    }
    @keyframes indicatorIn {
      from { opacity: 0; transform: translate(-50%, 18px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }
    .scroll-indicator {
      position: fixed;
      left: 50%; bottom: 18vh;
      transform: translateX(-50%);
      z-index: 20;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1.1rem 1.3rem;
      border-radius: 9999px;
      color: rgba(255,255,255,0.95);
      cursor: pointer;
      user-select: none;
      background: transparent;
      border: none;
      animation: indicatorIn 1.1s cubic-bezier(0.16,1,0.3,1) 3.5s both;
    }
    .scroll-indicator .chevrons {
      animation: chevronDrift 1.8s ease-in-out infinite;
    }

    /* ── Card fade-up ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-in {
      animation: fadeUp 1.2s cubic-bezier(0.16,1,0.3,1) 0.15s both;
    }

    /* ── First viewport brand (appear after 3s) ── */
    .vp1-tag  { animation: fadeUp 1.1s cubic-bezier(0.16,1,0.3,1) 3s both; }

    /* ── WhatsApp button pulse ring ── */
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(37,211,102,0.4); }
      70%  { box-shadow: 0 0 0 10px rgba(37,211,102,0); }
      100% { box-shadow: 0 0 0 0 rgba(37,211,102,0); }
    }
    .wa-btn {
      animation: pulse 2.4s ease-out infinite;
    }

    a { cursor: pointer; text-decoration: none; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

/* ── LUNE brand mark ── */
function LuneMark({ size = 28 }) {
  return (
    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
      <path d="M 4.688 136 C 68.373 136 120 187.627 120 251.312 C 120 252.883 119.967 254.445 119.905 256 L 0 256 L 0 136.096 C 1.555 136.034 3.117 136 4.688 136 Z M 251.312 136 C 252.883 136 254.445 136.034 256 136.096 L 256 256 L 136.095 256 C 136.032 254.438 136.001 252.875 136 251.312 C 136 187.627 187.627 136 251.312 136 Z M 119.905 0 C 119.967 1.555 120 3.117 120 4.688 C 120 68.373 68.373 120 4.687 120 C 3.117 120 1.555 119.967 0 119.905 L 0 0 Z M 256 119.905 C 254.445 119.967 252.883 120 251.312 120 C 187.627 120 136 68.373 136 4.687 C 136 3.117 136.033 1.555 136.095 0 L 256 0 Z" />
    </svg>
  );
}

/* ── WhatsApp icon ── */
function IconWhatsApp({ size = 20 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
    </svg>
  );
}

/* ── Smooth scroll (rAF, EASE = 0.04 for premium feel) ── */
function useSmoothScroll() {
  useEffect(() => {
    let target = window.scrollY, current = window.scrollY;
    let rafId = null, running = false;
    const EASE = 0.04;

    const onWheel = (e) => {
      if (e.ctrlKey || e.metaKey) return;
      e.preventDefault();
      const max = document.documentElement.scrollHeight - window.innerHeight;
      target = Math.max(0, Math.min(max, target + e.deltaY));
      if (!running) loop();
    };

    const onKey = (e) => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const vh = window.innerHeight;
      let delta = 0;
      if (e.key === "ArrowDown") delta = 80;
      else if (e.key === "ArrowUp") delta = -80;
      else if (e.key === "PageDown" || (e.key === " " && !e.shiftKey)) delta = vh * 0.9;
      else if (e.key === "PageUp"   || (e.key === " " &&  e.shiftKey)) delta = -vh * 0.9;
      else if (e.key === "Home") { target = 0; if (!running) loop(); return e.preventDefault(); }
      else if (e.key === "End")  { target = max; if (!running) loop(); return e.preventDefault(); }
      else return;
      target = Math.max(0, Math.min(max, target + delta));
      e.preventDefault();
      if (!running) loop();
    };

    const loop = () => {
      running = true;
      const diff = target - current;
      if (Math.abs(diff) < 0.4) { current = target; window.scrollTo(0, current); running = false; return; }
      current += diff * EASE;
      window.scrollTo(0, current);
      rafId = requestAnimationFrame(loop);
    };

    const onScroll = () => { if (!running) { current = window.scrollY; target = window.scrollY; } };

    const isTouch = window.matchMedia("(pointer: coarse)").matches;
    if (!isTouch) {
      window.addEventListener("wheel", onWheel, { passive: false });
      window.addEventListener("keydown", onKey);
    }
    window.addEventListener("scroll", onScroll, { passive: true });

    return () => {
      window.removeEventListener("wheel", onWheel);
      window.removeEventListener("keydown", onKey);
      window.removeEventListener("scroll", onScroll);
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, []);
}

/* ── Scroll indicator ── */
function ScrollIndicator({ onClick }) {
  return (
    <button
      type="button"
      onClick={onClick}
      aria-label="Scroll to content"
      className="liquid-glass scroll-indicator"
    >
      <span className="chevrons">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <polyline points="6 9 12 15 18 9" />
          <polyline points="6 14 12 20 18 14" />
        </svg>
      </span>
    </button>
  );
}

/* ── Instagram icon ── */
function IconInstagram({ size = 18 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
      <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
      <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
    </svg>
  );
}

/* ── Main card content ── */
function Card() {

  return (
    <div
      className="liquid-glass card-in"
      style={{
        borderRadius: "1.5rem",
        width: "100%",
        maxWidth: "640px",
        padding: "3rem 2.5rem 2rem",
        display: "flex",
        flexDirection: "column",
        gap: "0",
        color: "rgba(255,255,255,0.85)",
      }}
    >
      {/* Brand */}
      <div style={{ marginBottom: "2.25rem" }}>
        <span style={{ fontSize: "1.25rem", fontWeight: 500, letterSpacing: "0.22em", color: "#fff" }}>
          LUNE
        </span>
      </div>

      {/* Eyebrow */}
      <p style={{
        fontSize: "0.6875rem",
        textTransform: "uppercase",
        letterSpacing: "0.28em",
        color: "rgba(255,255,255,0.45)",
        marginBottom: "0.875rem",
      }}>
        Celestial Fragrances
      </p>

      {/* Headline */}
      <h1 style={{
        fontSize: "clamp(2rem, 5vw, 3rem)",
        fontWeight: 500,
        color: "#fff",
        lineHeight: 1.1,
        letterSpacing: "-0.02em",
        marginBottom: "1rem",
      }}>
        We don't create many<br />fragrances. We create<br />the right ones.
      </h1>

      {/* Sub */}
      <p style={{
        fontSize: "0.9375rem",
        color: "rgba(255,255,255,0.55)",
        lineHeight: 1.7,
        marginBottom: "2.5rem",
        maxWidth: "26rem",
      }}>
        Two scents born from the cosmos — Jupitor and Pluto. Order directly and we'll take care of the rest.
      </p>

      {/* Primary CTA — WhatsApp */}
      <a
        href="https://wa.me/918111811709"
        target="_blank"
        rel="noopener noreferrer"
        className="wa-btn"
        style={{
          display: "inline-flex",
          alignItems: "center",
          justifyContent: "center",
          gap: "0.625rem",
          borderRadius: "9999px",
          padding: "0.9rem 2rem",
          fontSize: "0.9375rem",
          fontWeight: 500,
          color: "#fff",
          background: "rgba(37,211,102,0.18)",
          border: "1px solid rgba(37,211,102,0.45)",
          backdropFilter: "blur(8px)",
          WebkitBackdropFilter: "blur(8px)",
          width: "fit-content",
          marginBottom: "2.5rem",
          transition: "background 0.2s, border-color 0.2s",
          cursor: "pointer",
        }}
        onMouseEnter={e => {
          e.currentTarget.style.background = "rgba(37,211,102,0.28)";
          e.currentTarget.style.borderColor = "rgba(37,211,102,0.7)";
        }}
        onMouseLeave={e => {
          e.currentTarget.style.background = "rgba(37,211,102,0.18)";
          e.currentTarget.style.borderColor = "rgba(37,211,102,0.45)";
        }}
      >
        <IconWhatsApp size={18} />
        Order on WhatsApp
      </a>

      {/* Divider */}
      <div style={{ height: "1px", background: "rgba(255,255,255,0.08)", marginBottom: "1.5rem" }} />

      {/* Bottom bar */}
      <div style={{
        display: "flex",
        alignItems: "center",
        justifyContent: "space-between",
        gap: "0.75rem",
      }}>
        <p style={{ fontSize: "0.625rem", textTransform: "uppercase", letterSpacing: "0.18em", color: "rgba(255,255,255,0.25)" }}>
          © {new Date().getFullYear()} LUNE
        </p>
        <a
          href="https://www.instagram.com/lune_perfumes_/"
          target="_blank"
          rel="noopener noreferrer"
          style={{
            display: "inline-flex",
            alignItems: "center",
            gap: "0.5rem",
            fontSize: "0.75rem",
            letterSpacing: "0.08em",
            color: "rgba(255,255,255,0.45)",
            transition: "color 0.2s",
          }}
          onMouseEnter={e => e.currentTarget.style.color = "rgba(255,255,255,0.9)"}
          onMouseLeave={e => e.currentTarget.style.color = "rgba(255,255,255,0.45)"}
        >
          <IconInstagram size={15} />
          @lune_perfumes_
        </a>
      </div>
    </div>
  );
}

/* ── App ── */
function App() {
  useSmoothScroll();

  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const fn = () => { if (window.scrollY > 2) setScrolled(true); };
    window.addEventListener("scroll", fn, { passive: true });
    return () => window.removeEventListener("scroll", fn);
  }, []);

  const scrollToContent = () => {
    window.scrollTo({ top: window.innerHeight, behavior: "smooth" });
  };

  return (
    <main style={{
      position: "relative",
      width: "100%",
      overflowX: "hidden",
      fontFamily: '"Helvetica Regular", "Helvetica Neue", Helvetica, Arial, sans-serif',
    }}>
      {/* Fixed video background */}
      <div style={{ position: "fixed", inset: 0, zIndex: 0, overflow: "hidden", pointerEvents: "none", background: "#000" }}>
        <video poster="background.png" src="palindrome.mp4" className="bg-video-el" autoPlay loop muted playsInline preload="auto" />
      </div>

      {/* Dark overlay */}
      <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.30)", zIndex: 1, pointerEvents: "none" }} />

      {/* First viewport — brand hero */}
      <section style={{
        position: "relative",
        width: "100%",
        height: "100vh",
        zIndex: 2,
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
        justifyContent: "center",
        paddingBottom: "24vh",
      }}>
        {/* Top-right: tagline + fragrances */}
        <div className="vp1-tag" style={{
          position: "absolute",
          top: "2.25rem",
          right: "2.5rem",
          display: "flex",
          flexDirection: "column",
          alignItems: "flex-end",
          gap: "0.45rem",
        }}>
          <span style={{
            fontSize: "0.625rem",
            textTransform: "uppercase",
            letterSpacing: "0.3em",
            color: "rgba(255,255,255,0.38)",
          }}>
            Celestial Fragrances
          </span>
          <div style={{ width: "100%", height: "1px", background: "rgba(255,255,255,0.18)" }} />
          <span style={{
            fontSize: "1rem",
            textTransform: "uppercase",
            letterSpacing: "0.2em",
            color: "rgba(255,255,255,0.65)",
          }}>Jupitor</span>
          <span style={{
            fontSize: "1rem",
            textTransform: "uppercase",
            letterSpacing: "0.2em",
            color: "rgba(255,255,255,0.65)",
          }}>Pluto</span>
        </div>
      </section>

      {/* Scroll indicator */}
      {!scrolled && <ScrollIndicator onClick={scrollToContent} />}

      {/* Second viewport — single glass card, centred */}
      <section style={{
        position: "relative",
        zIndex: 10,
        minHeight: "100vh",
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        padding: "4rem 1.5rem",
      }}>
        <Card />
      </section>
    </main>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
