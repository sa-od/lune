<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUNE — Celestial Fragrances</title>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    @font-face {
      font-family: "Helvetica Regular";
      src: url("https://db.onlinewebfonts.com/t/a64ff11d2c24584c767f6257e880dc65.woff2") format("woff2"),
           url("https://db.onlinewebfonts.com/t/a64ff11d2c24584c767f6257e880dc65.woff") format("woff"),
           url("https://db.onlinewebfonts.com/t/a64ff11d2c24584c767f6257e880dc65.ttf") format("truetype");
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; }
    html { scroll-behavior: auto; }
    body {
      font-family: "Helvetica Regular", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #000;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Liquid Glass ── */
    .liquid-glass {
      background: rgba(255,255,255,0.01);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%,
        rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0)    40%,
        rgba(255,255,255,0)    60%,
        rgba(255,255,255,0.15) 80%,
        rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* ── Background video ── */
    .bg-video-el {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: max(100vw, 177.78vh);
      height: max(56.25vw, 100vh);
      object-fit: cover;
    }
    @media (max-width: 768px) {
      .bg-video-el {
        height: 78vh;
        width: max(100vw, calc(78vh * 1924 / 1076));
      }
    }

    /* ── Scroll indicator ── */
    @keyframes chevronDrift {
      0%, 100% { transform: translateY(0);   opacity: 0.7; }
      50%       { transform: translateY(7px); opacity: 1;   }
    }
    @keyframes indicatorIn {
      from { opacity: 0; transform: translate(-50%, 18px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }
    .scroll-indicator {
      position: fixed;
      left: 50%; bottom: 18vh;
      transform: translateX(-50%);
      z-index: 20;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1.1rem 1.3rem;
      border-radius: 9999px;
      color: rgba(255,255,255,0.95);
      cursor: pointer;
      user-select: none;
      background: transparent;
      border: none;
      animation: indicatorIn 1.1s cubic-bezier(0.16,1,0.3,1) 3.5s both;
    }
    .scroll-indicator .chevrons {
      animation: chevronDrift 1.8s ease-in-out infinite;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-in  { animation: fadeUp 1.2s cubic-bezier(0.16,1,0.3,1) 0.15s both; }
    .vp1-tag  { animation: fadeUp 1.1s cubic-bezier(0.16,1,0.3,1) 3s both; }
    .fade-in  { animation: fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) both; }

    /* ── WhatsApp pulse ── */
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(37,211,102,0.4); }
      70%  { box-shadow: 0 0 0 10px rgba(37,211,102,0); }
      100% { box-shadow: 0 0 0 0 rgba(37,211,102,0); }
    }
    .wa-btn { animation: pulse 2.4s ease-out infinite; }

    /* ── Mobile sky / grass bands ── */
    .mobile-band {
      display: none;
      position: fixed;
      left: 0; right: 0;
      z-index: 2;
      pointer-events: none;
    }
    @media (max-width: 768px) {
      .mobile-band { display: block; }
      .mobile-band-top {
        top: 0; height: 11vh;
        background: rgba(138, 172, 196, 0.82);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow:
          inset 0 1px 0 rgba(220,242,255,0.45),
          inset 0 -1px 0 rgba(170,210,232,0.4),
          0 2px 16px rgba(138,172,196,0.25);
      }
      .mobile-band-bottom {
        bottom: 0; height: 11vh;
        background: rgba(56, 92, 26, 0.82);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow:
          inset 0 1px 0 rgba(105,185,68,0.35),
          inset 0 -1px 0 rgba(80,150,45,0.25),
          0 -2px 16px rgba(56,92,26,0.25);
      }
    }

    /* ── Gallery (products page) ── */
    .gallery-scroll {
      display: flex;
      overflow-x: scroll;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .gallery-scroll::-webkit-scrollbar { display: none; }
    .gallery-slide {
      flex: 0 0 100%;
      scroll-snap-align: start;
    }

    /* ── Product two-column layout ── */
    .product-layout {
      display: flex;
      gap: 2.5rem;
      align-items: flex-start;
    }
    .product-col-gallery { flex: 1 1 0; min-width: 0; }
    .product-col-info { flex: 1 1 0; min-width: 0; }
    @media (max-width: 768px) {
      .product-layout { flex-direction: column; gap: 0; }
    }

    a { cursor: pointer; text-decoration: none; }
    button { font-family: inherit; }
    img { display: block; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── Perfume data ── */
const perfumes = [

    notes: [

/* ── Icons ── */
function IconWhatsApp({ size = 18 }) {

      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>

}
function IconInstagram({ size = 15 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>

      <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
    </svg>
  );
}

/* ── Smooth scroll (home only) ── */
function useSmoothScroll() {
  useEffect(() => {
    let target = window.scrollY, current = window.scrollY;
    let rafId = null, running = false;
    const EASE = 0.04;
    const onWheel = (e) => {
      if (e.ctrlKey || e.metaKey) return;
      e.preventDefault();
      const max = document.documentElement.scrollHeight - window.innerHeight;
      target = Math.max(0, Math.min(max, target + e.deltaY));
      if (!running) loop();
    };
    const onKey = (e) => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const vh = window.innerHeight;
      let delta = 0;
      if (e.key === "ArrowDown") delta = 80;
      else if (e.key === "ArrowUp") delta = -80;
      else if (e.key === "PageDown" || (e.key === " " && !e.shiftKey)) delta = vh * 0.9;
      else if (e.key === "PageUp"   || (e.key === " " &&  e.shiftKey)) delta = -vh * 0.9;
      else if (e.key === "Home") { target = 0; if (!running) loop(); return e.preventDefault(); }
      else if (e.key === "End")  { target = max; if (!running) loop(); return e.preventDefault(); }
      else return;
      target = Math.max(0, Math.min(max, target + delta));
      e.preventDefault();
      if (!running) loop();
    };
    const loop = () => {
      running = true;
      const diff = target - current;
      if (Math.abs(diff) < 0.4) { current = target; window.scrollTo(0, current); running = false; return; }
      current += diff * EASE;
      window.scrollTo(0, current);
      rafId = requestAnimationFrame(loop);
    };
    const onScroll = () => { if (!running) { current = window.scrollY; target = window.scrollY; } };
    const isTouch = window.matchMedia("(pointer: coarse)").matches;
    if (!isTouch) {
      window.addEventListener("wheel", onWheel, { passive: false });
      window.addEventListener("keydown", onKey);
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => {
      window.removeEventListener("wheel", onWheel);
      window.removeEventListener("keydown", onKey);
      window.removeEventListener("scroll", onScroll);
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, []);
}

/* ── Scroll indicator ── */
function ScrollIndicator({ onClick }) {
  return (
    <button type="button" onClick={onClick} aria-label="Scroll to content" className="liquid-glass scroll-indicator">
      <span className="chevrons">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <polyline points="6 9 12 15 18 9" />
          <polyline points="6 14 12 20 18 14" />
        </svg>
      </span>
    </button>
  );
}

/* ── Product section ── */
function ProductSection({ perfume, isLast }) {
  const [active, setActive] = useState(0);
  const scrollRef = useRef(null);

  useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    const observer = new IntersectionObserver(
      (entries) => entries.forEach(e => {
        if (e.isIntersecting) setActive(Number(e.target.dataset.idx));
      }),
      { root: el, threshold: 0.55 }
    );
    Array.from(el.children).forEach(s => observer.observe(s));
    return () => observer.disconnect();
  }, []);

  const goTo = (i) => {
    const el = scrollRef.current;
    if (el) el.scrollTo({ left: el.offsetWidth * i, behavior: 'smooth' });
  };

  return (
    <section style={{ padding: '3.5rem 1.5rem', borderBottom: isLast ? 'none' : '1px solid rgba(0,0,0,0.07)' }}>
      <div style={{ maxWidth: '960px', margin: '0 auto' }}>
        <div className="product-layout">

          {/* Left: gallery */}
          <div className="product-col-gallery">
            <div style={{ borderRadius: '1rem', overflow: 'hidden' }}>
              <div ref={scrollRef} className="gallery-scroll">
                {perfume.images.map((src, i) => (
                  <div key={i} data-idx={String(i)} className="gallery-slide">
                    <img src={src} alt={`${perfume.name} — ${i + 1}`}
                      style={{ width: '100%', height: '70vh', objectFit: 'contain', background: '#EDE9E3', display: 'block' }} />
                  </div>
                ))}
              </div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '0.45rem', padding: '0.75rem 0 0' }}>
              {perfume.images.map((_, i) => (
                <button key={i} onClick={() => goTo(i)} aria-label={`Image ${i + 1}`} style={{
                  width: i === active ? '26px' : '6px', height: '6px',
                  borderRadius: '9999px',
                  background: i === active ? 'rgba(0,0,0,0.55)' : 'rgba(0,0,0,0.15)',
                  border: 'none', cursor: 'pointer', padding: 0,
                  transition: 'all 0.38s cubic-bezier(0.16,1,0.3,1)',
                }} />
              ))}
            </div>
          </div>

          {/* Right: info */}
          <div className="product-col-info">
            <p style={{ fontSize: '0.5625rem', textTransform: 'uppercase', letterSpacing: '0.3em', color: 'rgba(0,0,0,0.32)', marginBottom: '0.3rem' }}>{perfume.edp}</p>
            <h2 style={{ fontSize: 'clamp(2.2rem, 5vw, 3.5rem)', fontWeight: 500, letterSpacing: '0.1em', color: '#1a1a1a', lineHeight: 1, marginBottom: '0.25rem' }}>{perfume.name}</h2>
            <p style={{ fontSize: '0.6875rem', letterSpacing: '0.22em', textTransform: 'uppercase', color: 'rgba(0,0,0,0.35)', marginBottom: '1.5rem' }}>{perfume.subtitle}</p>

            <div style={{
              background: 'rgba(255,255,255,0.55)',
              backdropFilter: 'blur(20px)', WebkitBackdropFilter: 'blur(20px)',
              border: '1px solid rgba(255,255,255,0.85)',
              borderRadius: '1.25rem',
              padding: '1.5rem 1.375rem',
              boxShadow: '0 2px 20px rgba(0,0,0,0.05)',
            }}>
              <p style={{ fontSize: '0.875rem', lineHeight: 1.78, color: 'rgba(0,0,0,0.52)', marginBottom: '1.25rem' }}>{perfume.description}</p>
              <div style={{ marginBottom: '1.5rem' }}>
                {perfume.notes.map((n, i) => (
                  <div key={n.label} style={{
                    display: 'flex', justifyContent: 'space-between', alignItems: 'baseline',
                    padding: '0.55rem 0',
                    borderBottom: i < perfume.notes.length - 1 ? '1px solid rgba(0,0,0,0.06)' : 'none',
                  }}>
                    <span style={{ fontSize: '0.5rem', textTransform: 'uppercase', letterSpacing: '0.24em', color: 'rgba(0,0,0,0.28)' }}>{n.label}</span>
                    <span style={{ fontSize: '0.75rem', letterSpacing: '0.1em', color: 'rgba(0,0,0,0.62)' }}>{n.value}</span>
                  </div>
                ))}
              </div>
              <a href={`https://wa.me/918111811709?text=${encodeURIComponent(`Hey! I'm interested in buying ${perfume.name} by LUNE. Can you help me place an order?`)}`} target="_blank" rel="noopener noreferrer" className="wa-btn" style={{
                display: 'inline-flex', alignItems: 'center', gap: '0.5rem',
                borderRadius: '9999px', padding: '0.55rem 1.1rem', fontSize: '0.75rem', fontWeight: 500,
                color: '#fff', background: '#1a9e4a', border: 'none',
                transition: 'background 0.2s',
              }}
                onMouseEnter={e => { e.currentTarget.style.background='#168040'; }}
                onMouseLeave={e => { e.currentTarget.style.background='#1a9e4a'; }}
              >
                <IconWhatsApp size={15} />
                Order {perfume.name} on WhatsApp
              </a>
            </div>
          </div>

        </div>
      </div>
    </section>
  );
}

/* ══════════════════════════════════
   HOME PAGE
══════════════════════════════════ */
function HomePage({ navigate }) {
  useSmoothScroll();
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const fn = () => { if (window.scrollY > 2) setScrolled(true); };
    window.addEventListener('scroll', fn, { passive: true });
    return () => window.removeEventListener('scroll', fn);
  }, []);
  const scrollToContent = () => window.scrollTo({ top: window.innerHeight, behavior: 'smooth' });

  return (
    <main style={{ position: 'relative', width: '100%', overflowX: 'hidden', fontFamily: '"Helvetica Regular", "Helvetica Neue", Helvetica, Arial, sans-serif' }}>
      {/* Fixed video background */}
      <div style={{ position: 'fixed', inset: 0, zIndex: 0, overflow: 'hidden', pointerEvents: 'none', background: 'linear-gradient(to bottom, #B8D4E6 0%, #000 13%, #000 87%, #4E7A2A 100%)' }}>
        <video poster="background.png" src="palindrome.mp4" className="bg-video-el" autoPlay loop muted playsInline preload="auto" />
      </div>

      {/* Dark overlay */}
      <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.30)', zIndex: 1, pointerEvents: 'none' }} />

      {/* Mobile bands */}
      <div className="mobile-band mobile-band-top" />
      <div className="mobile-band mobile-band-bottom" />

      {/* First viewport */}
      <section style={{ position: 'relative', width: '100%', height: '100vh', zIndex: 3, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', paddingBottom: '24vh' }}>
        <div className="vp1-tag" style={{ position: 'absolute', top: '2.25rem', right: '2.5rem', display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: '0.45rem' }}>
          <span style={{ fontSize: '0.625rem', textTransform: 'uppercase', letterSpacing: '0.3em', color: 'rgba(255,255,255,0.38)' }}>Celestial Fragrances</span>
          <div style={{ width: '100%', height: '1px', background: 'rgba(255,255,255,0.18)' }} />
          <span style={{ fontSize: '1rem', textTransform: 'uppercase', letterSpacing: '0.2em', color: 'rgba(255,255,255,0.65)' }}>Jupitor</span>
          <span style={{ fontSize: '1rem', textTransform: 'uppercase', letterSpacing: '0.2em', color: 'rgba(255,255,255,0.65)' }}>Pluto</span>
        </div>
      </section>

      {!scrolled && <ScrollIndicator onClick={scrollToContent} />}

      {/* Second viewport — card */}
      <section style={{ position: 'relative', zIndex: 10, minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '4rem 1.5rem' }}>
        <div className="liquid-glass card-in" style={{ borderRadius: '1.5rem', width: '100%', maxWidth: '640px', padding: '3rem 2.5rem 2rem', display: 'flex', flexDirection: 'column', color: 'rgba(255,255,255,0.85)' }}>
          <div style={{ marginBottom: '2.25rem' }}>
            <span style={{ fontSize: '1.25rem', fontWeight: 500, letterSpacing: '0.22em', color: '#fff' }}>LUNE</span>
          </div>
          <p style={{ fontSize: '0.6875rem', textTransform: 'uppercase', letterSpacing: '0.28em', color: 'rgba(255,255,255,0.45)', marginBottom: '0.875rem' }}>Celestial Fragrances</p>
          <h1 style={{ fontSize: 'clamp(2rem,5vw,3rem)', fontWeight: 500, color: '#fff', lineHeight: 1.1, letterSpacing: '-0.02em', marginBottom: '1rem' }}>
            We don't create many<br />fragrances. We create<br />the right ones.
          </h1>
          <p style={{ fontSize: '0.9375rem', color: 'rgba(255,255,255,0.55)', lineHeight: 1.7, marginBottom: '2.5rem', maxWidth: '26rem' }}>
            Two scents born from the cosmos — Jupitor and Pluto. Order directly and we'll take care of the rest.
          </p>

          {/* Primary CTA */}
          <button
            onClick={() => navigate('/products')}
            style={{
              display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: '0.625rem',
              borderRadius: '9999px', padding: '0.9rem 2.25rem',
              fontSize: '0.875rem', fontWeight: 500, letterSpacing: '0.1em', textTransform: 'uppercase',
              color: '#fff', background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.18)',
              backdropFilter: 'blur(8px)', WebkitBackdropFilter: 'blur(8px)',
              width: 'fit-content', marginBottom: '2.5rem', cursor: 'pointer',
              transition: 'background 0.2s, border-color 0.2s',
              fontFamily: 'inherit',
            }}
            onMouseEnter={e => { e.currentTarget.style.background='rgba(255,255,255,0.14)'; e.currentTarget.style.borderColor='rgba(255,255,255,0.35)'; }}
            onMouseLeave={e => { e.currentTarget.style.background='rgba(255,255,255,0.08)'; e.currentTarget.style.borderColor='rgba(255,255,255,0.18)'; }}

/* ══════════════════════════════════
   ROUTER
══════════════════════════════════ */
function App() {
  const getView = () => window.location.hash === '#products' ? 'products' : 'home';
  const [view, setView] = useState(getView);

  const navigate = (path) => {
    const isProducts = path.startsWith('/products');
    // Use hash fragments — never a real path, so any server works (Live Server, Next.js, etc.)
    history.pushState({}, '', isProducts ? '#products' : location.pathname);
    window.scrollTo(0, 0);
    setView(isProducts ? 'products' : 'home');
  };

  useEffect(() => {
    const onPop = () => { window.scrollTo(0, 0); setView(getView()); };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  return view === 'products'
    ? <ProductsPage navigate={navigate} />
    : <HomePage navigate={navigate} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
