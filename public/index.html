<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUNE — Celestial Fragrances</title>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    @font-face {
      font-family: "Helvetica Regular";
      src: url("https://db.onlinewebfonts.com/t/a64ff11d2c24584c767f6257e880dc65.woff2") format("woff2"),
           url("https://db.onlinewebfonts.com/t/a64ff11d2c24584c767f6257e880dc65.woff") format("woff"),
           url("https://db.onlinewebfonts.com/t/a64ff11d2c24584c767f6257e880dc65.ttf") format("truetype");
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; }
    html { scroll-behavior: auto; }
    body {
      font-family: "Helvetica Regular", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #000;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Liquid Glass ── */
    .liquid-glass {
      background: rgba(255,255,255,0.01);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%,
        rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0)    40%,
        rgba(255,255,255,0)    60%,
        rgba(255,255,255,0.15) 80%,
        rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* ── Background video ── */
    .bg-video-el {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: max(100vw, 177.78vh);
      height: max(56.25vw, 100vh);
      object-fit: cover;
    }
    @media (max-width: 768px) {
      .bg-video-el {
        height: 89vh;
        width: max(100vw, calc(89vh * 1924 / 1076));
        top: 55.5vh;
      }
    }

    /* ── Scroll indicator ── */
    @keyframes chevronDrift {
      0%, 100% { transform: translateY(0);   opacity: 0.7; }
      50%       { transform: translateY(7px); opacity: 1;   }
    }
    @keyframes indicatorIn {
      from { opacity: 0; transform: translate(-50%, 18px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }
    .scroll-indicator {
      position: fixed;
      left: 50%; bottom: 18vh;
      transform: translateX(-50%);
      z-index: 20;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1.1rem 1.3rem;
      border-radius: 9999px;
      color: rgba(255,255,255,0.95);
      cursor: pointer;
      user-select: none;
      background: transparent;
      border: none;
      animation: indicatorIn 1.1s cubic-bezier(0.16,1,0.3,1) 3.5s both;
    }
    .scroll-indicator .chevrons {
      animation: chevronDrift 1.8s ease-in-out infinite;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-in  { animation: fadeUp 1.2s cubic-bezier(0.16,1,0.3,1) 0.15s both; }
    .vp1-tag  { animation: fadeUp 1.1s cubic-bezier(0.16,1,0.3,1) 1s both; }
    .fade-in  { animation: fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) both; }

    /* ── WhatsApp pulse ── */
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(37,211,102,0.4); }
      70%  { box-shadow: 0 0 0 10px rgba(37,211,102,0); }
      100% { box-shadow: 0 0 0 0 rgba(37,211,102,0); }
    }
    .wa-btn { animation: pulse 2.4s ease-out infinite; }

    /* ── Mobile bands ── */
    .mobile-band {
      display: none;
      position: fixed;
      left: 0; right: 0;
      z-index: 10;
    }
    @media (max-width: 768px) {
      .dark-overlay { top: 11vh !important; }
      .vp1-tag { top: calc(11vh + 0.875rem) !important; }
      .mobile-band {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1.25rem;
        pointer-events: auto;
      }
      .mobile-band-top {
        top: 0; height: 11vh;
        background:
          linear-gradient(rgba(0,0,0,0.30), rgba(0,0,0,0.30)),
          url('sky-bg.png') center top / cover no-repeat;
      }
    }

    /* ── Gallery (products page) ── */
    .gallery-scroll {
      display: flex;
      overflow-x: scroll;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .gallery-scroll::-webkit-scrollbar { display: none; }
    .gallery-slide {
      flex: 0 0 100%;
      scroll-snap-align: start;
      position: relative;
    }

    /* ── Collection entrance animations ── */
    @keyframes luxFadeUp {
      from { opacity: 0; transform: translateY(36px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes luxFade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes glowDrift {
      0%,100% { transform: scale(1)    translate(0,0);       opacity: 1;    }
      38%     { transform: scale(1.1)  translate(2%,-2.5%);  opacity: 0.78; }
      70%     { transform: scale(0.92) translate(-1.5%,1.8%);opacity: 0.88; }
    }
    .lux-fade-up   { animation: luxFadeUp 1.1s cubic-bezier(0.16,1,0.3,1) both; }
    .lux-fade-up-2 { animation: luxFadeUp 1.1s cubic-bezier(0.16,1,0.3,1) 0.22s both; }
    .lux-fade-up-3 { animation: luxFadeUp 1.1s cubic-bezier(0.16,1,0.3,1) 0.42s both; }
    .lux-fade      { animation: luxFade  1.5s ease both; }
    .glow-drift    { animation: glowDrift 16s ease-in-out infinite; }

    /* ── Product layout ── */
    .product-layout {
      display: flex;
      gap: 4rem;
      align-items: flex-start;
    }
    .product-col-gallery {
      flex: 0 0 58%;
      min-width: 0;
    }
    .product-col-info {
      flex: 1 1 0;
      min-width: 0;
      position: sticky;
      top: 78px;
    }
    .product-section { padding: 6rem 2.5rem; }
    @media (max-width: 900px) {
      .product-layout { flex-direction: column; gap: 2.5rem; }
      .product-col-gallery { flex: none; width: 100%; }
      .product-col-info { position: static; }
    }
    @media (max-width: 768px) {
      .product-section { padding: 3.5rem 1.5rem; }
    }

    a { cursor: pointer; text-decoration: none; }
    button { font-family: inherit; }
    img { display: block; }

    /* ── Soft daylight atmospheric background ── */
    .collection-bg {
      background:
        radial-gradient(ellipse 105% 58% at 50% -5%,  rgba(217,227,232,0.72) 0%, transparent 62%),
        radial-gradient(ellipse 58%  48% at 0%  35%,  rgba(215,223,209,0.55) 0%, transparent 55%),
        radial-gradient(ellipse 52%  42% at 100% 58%, rgba(207,214,207,0.48) 0%, transparent 56%),
        radial-gradient(ellipse 80%  42% at 50%  108%, rgba(232,236,232,0.52) 0%, transparent 60%),
        radial-gradient(ellipse 90%  90% at 50%  50%,  rgba(243,239,231,0.28) 0%, transparent 72%),
        linear-gradient(158deg, #f0ede8 0%, #eaece7 22%, #edebe7 45%, #e9ecec 70%, #edeae7 100%);
      background-attachment: fixed;
    }

    /* ── Warm milky glass card ── */
    .premium-glass {
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(28px) saturate(108%);
      -webkit-backdrop-filter: blur(28px) saturate(108%);
      border: 1px solid rgba(31,37,45,0.065);
      border-radius: 2rem;
      box-shadow:
        0 20px 60px rgba(31,37,45,0.08),
        0 4px 16px rgba(31,37,45,0.05),
        inset 0 1px 0 rgba(255,255,255,0.92);
      position: relative;
      overflow: hidden;
      transition: transform 0.55s cubic-bezier(0.16,1,0.3,1),
                  box-shadow 0.55s cubic-bezier(0.16,1,0.3,1);
    }
    .premium-glass:hover {
      transform: translateY(-5px);
      box-shadow:
        0 30px 75px rgba(31,37,45,0.11),
        0 6px 20px rgba(31,37,45,0.06),
        inset 0 1px 0 rgba(255,255,255,0.96);
    }
    .premium-glass::before {
      content: '';
      position: absolute;
      top: 0; left: 12%; right: 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.92), transparent);
      pointer-events: none;
    }
    .premium-glass::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(148deg, rgba(255,255,255,0.28) 0%, transparent 40%);
      pointer-events: none;
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── Perfume data ── */
const perfumes = [
  {
    id: 'jupitor',
    name: 'JUPITOR',
    subtitle: 'Celestial Warmth',
    edp: 'Eau de Parfum · 50 ml',
    description: 'A solar warmth born from the largest of planets. Bergamot opens into jasmine petals, settling gently on aged sandalwood and warm amber.',
    notes: [
      { label: 'Top',   value: 'Bergamot · Citrus' },
      { label: 'Heart', value: 'Jasmine · Neroli' },
      { label: 'Base',  value: 'Sandalwood · Amber' },
    ],
    images: ['jupitor/grass.png', 'jupitor/stone.png'],
  },
  {
    id: 'pluto',
    name: 'PLUTO',
    subtitle: 'Cold Mystery',
    edp: 'Eau de Parfum · 50 ml',
    description: 'A cold mystery from the edge of the cosmos. Black pepper and iris cut through the dark, grounded by deep vetiver and white musk.',
    notes: [
      { label: 'Top',   value: 'Black Pepper · Cardamom' },
      { label: 'Heart', value: 'Iris · Violet' },
      { label: 'Base',  value: 'Vetiver · White Musk' },
    ],
    images: ['pluto/sky.png', 'pluto/flower.png'],
  },
];

/* ── Icons ── */
function IconWhatsApp({ size = 18 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
    </svg>
  );
}
function IconInstagram({ size = 15 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
      <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
      <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
    </svg>
  );
}

/* ── Smooth scroll (home only) ── */
function useSmoothScroll() {
  useEffect(() => {
    let target = window.scrollY, current = window.scrollY;
    let rafId = null, running = false;
    const EASE = 0.04;
    const onWheel = (e) => {
      if (e.ctrlKey || e.metaKey) return;
      e.preventDefault();
      const max = document.documentElement.scrollHeight - window.innerHeight;
      target = Math.max(0, Math.min(max, target + e.deltaY));
      if (!running) loop();
    };
    const onKey = (e) => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const vh = window.innerHeight;
      let delta = 0;
      if (e.key === "ArrowDown") delta = 80;
      else if (e.key === "ArrowUp") delta = -80;
      else if (e.key === "PageDown" || (e.key === " " && !e.shiftKey)) delta = vh * 0.9;
      else if (e.key === "PageUp"   || (e.key === " " &&  e.shiftKey)) delta = -vh * 0.9;
      else if (e.key === "Home") { target = 0; if (!running) loop(); return e.preventDefault(); }
      else if (e.key === "End")  { target = max; if (!running) loop(); return e.preventDefault(); }
      else return;
      target = Math.max(0, Math.min(max, target + delta));
      e.preventDefault();
      if (!running) loop();
    };
    const loop = () => {
      running = true;
      const diff = target - current;
      if (Math.abs(diff) < 0.4) { current = target; window.scrollTo(0, current); running = false; return; }
      current += diff * EASE;
      window.scrollTo(0, current);
      rafId = requestAnimationFrame(loop);
    };
    const onScroll = () => { if (!running) { current = window.scrollY; target = window.scrollY; } };
    const isTouch = window.matchMedia("(pointer: coarse)").matches;
    if (!isTouch) {
      window.addEventListener("wheel", onWheel, { passive: false });
      window.addEventListener("keydown", onKey);
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => {
      window.removeEventListener("wheel", onWheel);
      window.removeEventListener("keydown", onKey);
      window.removeEventListener("scroll", onScroll);
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, []);
}

/* ── Scroll indicator ── */
function ScrollIndicator({ onClick }) {
  return (
    <button type="button" onClick={onClick} aria-label="Scroll to content" className="liquid-glass scroll-indicator">
      <span className="chevrons">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <polyline points="6 9 12 15 18 9" />
          <polyline points="6 14 12 20 18 14" />
        </svg>
      </span>
    </button>
  );
}

/* ── Product section ── */
function ProductSection({ perfume, isLast, index }) {
  const [active, setActive] = useState(0);
  const scrollRef = useRef(null);

  useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    const observer = new IntersectionObserver(
      (entries) => entries.forEach(e => {
        if (e.isIntersecting) setActive(Number(e.target.dataset.idx));
      }),
      { root: el, threshold: 0.55 }
    );
    Array.from(el.children).forEach(s => observer.observe(s));
    return () => observer.disconnect();
  }, []);

  const goTo = (i) => {
    const el = scrollRef.current;
    if (el) el.scrollTo({ left: el.offsetWidth * i, behavior: 'smooth' });
  };

  const num = String(index + 1).padStart(2, '0');
  const glowColor = index === 0
    ? 'rgba(210,182,128,0.55)'
    : 'rgba(178,198,182,0.48)';

  return (
    <section className="product-section lux-fade-up" style={{
      borderBottom: isLast ? 'none' : '1px solid rgba(31,37,45,0.07)',
    }}>
      <div style={{ maxWidth: '1040px', margin: '0 auto' }}>

        {/* Editorial header */}
        <div className="lux-fade" style={{ marginBottom: '3.5rem' }}>
          <span style={{
            display: 'block',
            fontSize: '0.4375rem', letterSpacing: '0.45em', textTransform: 'uppercase',
            color: 'rgba(31,37,45,0.28)', marginBottom: '0.7rem',
          }}>— {num} —</span>
          <h2 style={{
            fontSize: 'clamp(3.2rem, 7.5vw, 5.5rem)',
            fontWeight: 300, letterSpacing: '0.1em', textTransform: 'uppercase',
            color: '#1f252d', lineHeight: 0.88,
          }}>{perfume.name}</h2>
        </div>

        <div className="product-layout">

          {/* Gallery */}
          <div className="product-col-gallery lux-fade-up-2">
            <div style={{ position: 'relative' }}>

              {/* Warm ambient glow behind bottle */}
              <div className="glow-drift" style={{
                position: 'absolute', inset: '-38%', zIndex: 0, pointerEvents: 'none',
                background: `radial-gradient(ellipse 62% 55% at 50% 50%, ${glowColor} 0%, transparent 68%)`,
                filter: 'blur(52px)',
              }} />

              {/* Gallery carousel */}
              <div ref={scrollRef} className="gallery-scroll" style={{
                position: 'relative', zIndex: 1,
                borderRadius: '1.5rem', overflow: 'hidden',
              }}>
                {perfume.images.map((src, i) => (
                  <div key={i} data-idx={String(i)} className="gallery-slide">
                    {/* Soft warm vignette */}
                    <div style={{
                      position: 'absolute', inset: 0, zIndex: 2, pointerEvents: 'none',
                      background: 'radial-gradient(ellipse 80% 80% at 50% 50%, transparent 50%, rgba(237,235,231,0.42) 100%)',
                    }} />
                    <img src={src} alt={`${perfume.name} — ${i + 1}`} style={{
                      width: '100%', height: '72vh',
                      objectFit: 'contain',
                      background: 'rgba(243,239,231,0.35)',
                      display: 'block',
                    }} />
                  </div>
                ))}
              </div>
            </div>

            {/* Minimal line indicators */}
            <div style={{
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              gap: '0.5rem', paddingTop: '1.25rem',
            }}>
              {perfume.images.map((_, i) => (
                <button key={i} onClick={() => goTo(i)} aria-label={`Image ${i + 1}`} style={{
                  width: i === active ? '30px' : '6px', height: '1px',
                  borderRadius: '9999px',
                  background: i === active ? 'rgba(31,37,45,0.55)' : 'rgba(31,37,45,0.18)',
                  border: 'none', cursor: 'pointer', padding: 0,
                  transition: 'all 0.5s cubic-bezier(0.16,1,0.3,1)',
                }} />
              ))}
            </div>
          </div>

          {/* Info card */}
          <div className="product-col-info lux-fade-up-3">
            <div className="premium-glass" style={{ padding: '2.75rem 2.25rem' }}>

              <p style={{
                fontSize: '0.4375rem', textTransform: 'uppercase', letterSpacing: '0.40em',
                color: 'rgba(31,37,45,0.38)', marginBottom: '0.4rem',
              }}>{perfume.edp}</p>

              <p style={{
                fontSize: '0.6875rem', letterSpacing: '0.28em', textTransform: 'uppercase',
                color: 'rgba(31,37,45,0.5)', marginBottom: '2rem', fontWeight: 400,
              }}>{perfume.subtitle}</p>

              <p style={{
                fontSize: '0.9375rem', lineHeight: 1.9,
                color: 'rgba(31,37,45,0.6)', marginBottom: '2.75rem',
                letterSpacing: '0.01em',
              }}>{perfume.description}</p>

              {/* Notes */}
              <div style={{ marginBottom: '2.75rem' }}>
                {perfume.notes.map((n, i) => (
                  <div key={n.label} style={{
                    display: 'flex', justifyContent: 'space-between', alignItems: 'baseline',
                    padding: '0.8rem 0',
                    borderBottom: i < perfume.notes.length - 1
                      ? '1px solid rgba(31,37,45,0.07)'
                      : 'none',
                  }}>
                    <span style={{
                      fontSize: '0.4375rem', textTransform: 'uppercase',
                      letterSpacing: '0.34em', color: 'rgba(31,37,45,0.32)',
                    }}>{n.label}</span>
                    <span style={{
                      fontSize: '0.75rem', letterSpacing: '0.14em',
                      color: 'rgba(31,37,45,0.75)',
                    }}>{n.value}</span>
                  </div>
                ))}
              </div>

              {/* Ghost CTA */}
              <a href={`https://wa.me/918111811709?text=${encodeURIComponent(`Hey! I'm interested in buying ${perfume.name} by LUNE. Can you help me place an order?`)}`}
                target="_blank" rel="noopener noreferrer"
                style={{
                  display: 'inline-flex', alignItems: 'center', gap: '0.6rem',
                  padding: '0.8rem 1.6rem',
                  borderRadius: '9999px',
                  fontSize: '0.625rem', fontWeight: 400, letterSpacing: '0.18em',
                  textTransform: 'uppercase',
                  color: 'rgba(31,37,45,0.65)',
                  background: 'rgba(31,37,45,0.05)',
                  border: '1px solid rgba(31,37,45,0.1)',
                  backdropFilter: 'blur(8px)', WebkitBackdropFilter: 'blur(8px)',
                  transition: 'background 0.35s, border-color 0.35s, color 0.35s, transform 0.35s',
                }}
                onMouseEnter={e => {

/* ══════════════════════════════════
   ROUTER
══════════════════════════════════ */
function App() {
  const getView = () => window.location.hash === '#products' ? 'products' : 'home';
  const [view, setView] = useState(getView);

  const navigate = (path) => {
    const isProducts = path.startsWith('/products');
    // Use hash fragments — never a real path, so any server works (Live Server, Next.js, etc.)
    history.pushState({}, '', isProducts ? '#products' : location.pathname);
    window.scrollTo(0, 0);
    setView(isProducts ? 'products' : 'home');
  };

  useEffect(() => {
    const onPop = () => { window.scrollTo(0, 0); setView(getView()); };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  return view === 'products'
    ? <ProductsPage navigate={navigate} />
    : <HomePage navigate={navigate} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
